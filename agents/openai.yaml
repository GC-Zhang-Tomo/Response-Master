interface:
  display_name: "Lab Reviewer Response"
  short_description: "Draft reviewer responses and manuscript revision maps"
  default_prompt: "Use $lab-reviewer-response for this returned manuscript package. Start by showing the mandatory chat intake checklist. Do not draft the response until the originally submitted manuscript, complete reviewer comments, and an added-experiment evidence summary containing concrete data, conditions, and results are all present and usable."
policy:
  allow_implicit_invocation: true
